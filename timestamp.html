<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2838">
<title>ByteFormatika :: Unix-время</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <b>ByteFormatika</b>
  <span class="sep">::</span>
  <a href="index.html">главная</a>
  <span class="sep">|</span>
  <a href="tools.html">инструменты</a>
  <span class="sep">|</span>
  <span class="active">время</span>
  <span class="sep">|</span>
  <a href="about.html">об авторе</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>Unix-<span class="byte">время</span></h1>
    <div class="sub">// timestamp ↔ дата //</div>
  </div>

  <div class="panel">
    <h2>Сейчас</h2>
    <div class="result-wrap">
      <div class="result" id="nowOut">—</div>
      <button class="copy" id="copyNow" hidden>копировать</button>
    </div>
  </div>

  <div class="panel">
    <h2>Timestamp → дата</h2>
    <label for="ts">Unix-время (секунды)</label>
    <input id="ts" type="text" inputmode="numeric" placeholder="1700000000">
    <div class="tool-row">
      <button class="btn" id="tsBtn">→ перевести</button>
      <button class="btn" id="tsNow">сейчас</button>
    </div>
    <div class="result-wrap" style="margin-top:12px">
      <div class="result" id="tsOut" style="font-size:14px">—</div>
    </div>
  </div>

  <div class="panel">
    <h2>Дата → timestamp</h2>
    <label for="dt">Дата и время (ГГГГ-ММ-ДДTЧЧ:ММ)</label>
    <input id="dt" type="text" placeholder="2026-01-01T00:00">
    <div class="tool-row">
      <button class="btn" id="dtBtn">→ перевести</button>
      <button class="btn" id="dtNow">сейчас</button>
    </div>
    <div class="result-wrap" style="margin-top:12px">
      <div class="result" id="dtOut" style="font-size:14px">—</div>
    </div>
  </div>

  <div class="foot">
    &copy; ByteFormatika &nbsp;·&nbsp; 2026–????<br>
    <a href="tools.html">← к инструментам</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function pad(n) { return String(n).padStart(2, '0'); }

function updateNow() {
  const d = new Date();
  const s = Math.floor(d.getTime() / 1000);
  $('nowOut').textContent = s + '   ·   ' + d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
  $('copyNow').hidden = false;
}

updateNow();
setInterval(updateNow, 1000);

$('copyNow').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('nowOut').textContent);
    $('copyNow').textContent = 'скопировано';
    setTimeout(() => $('copyNow').textContent = 'копировать', 1000);
  } catch {}
};

$('tsBtn').onclick = () => {
  const s = +$('ts').value.trim();
  if (!isFinite(s)) { $('tsOut').textContent = 'Введите число.'; return; }
  const d = new Date(s * 1000);
  $('tsOut').textContent = d.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
};
$('tsNow').onclick = () => {
  $('ts').value = Math.floor(Date.now() / 1000);
  $('tsBtn').click();
};

$('dtBtn').onclick = () => {
  const v = $('dt').value.trim();
  const d = new Date(v);
  if (isNaN(d.getTime())) { $('dtOut').textContent = 'Не удалось разобрать дату.'; return; }
  $('dtOut').textContent = Math.floor(d.getTime() / 1000) + ' (секунды)';
};
$('dtNow').onclick = () => {
  const d = new Date();
  $('dt').value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) +
                  'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('dtBtn').click();
};
</script>
</body>
</html>
