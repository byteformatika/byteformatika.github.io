<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2838">
<title>ByteFormatika :: пароли</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <b>ByteFormatika</b>
  <span class="sep">::</span>
  <a href="index.html">главная</a>
  <span class="sep">|</span>
  <a href="tools.html">инструменты</a>
  <span class="sep">|</span>
  <span class="active">пароли</span>
  <span class="sep">|</span>
  <a href="about.html">об авторе</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>Генератор <span class="byte">паролей</span></h1>
    <div class="sub">// криптостойкий random //</div>
  </div>

  <div class="panel">
    <h2>Параметры</h2>
    <div class="form-grid row-3">
      <div>
        <label for="len">Длина</label>
        <input id="len" type="number" min="4" max="128" value="16">
      </div>
      <div>
        <label for="count">Количество</label>
        <input id="count" type="number" min="1" max="50" value="5">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="btn" id="genBtn" style="width:100%;padding:10px">сгенерировать</button>
      </div>
    </div>

    <div style="margin-top:10px">
      <label><input type="checkbox" id="upper" checked> A–Z (заглавные)</label>
      <label><input type="checkbox" id="lower" checked> a–z (строчные)</label>
      <label><input type="checkbox" id="digits" checked> 0–9 (цифры)</label>
      <label><input type="checkbox" id="symbols" checked> !@#$%^&* (символы)</label>
    </div>
  </div>

  <div class="panel">
    <h2>Пароли</h2>
    <div id="outList"></div>
  </div>

  <div class="foot">
    &copy; ByteFormatika &nbsp;·&nbsp; 2026–????<br>
    <a href="tools.html">← к инструментам</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SETS = {
  upper:   'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower:   'abcdefghijklmnopqrstuvwxyz',
  digits:  '0123456789',
  symbols: '!@#$%^&*()-_=+[]{};:,.<>?/'
};

function randInt(max) {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] % max;
}

function genOne(len, alphabet) {
  let pwd = '';
  for (let i = 0; i < len; i++) {
    pwd += alphabet[randInt(alphabet.length)];
  }
  return pwd;
}

$('genBtn').onclick = () => {
  const len = Math.max(4, Math.min(128, +$('len').value || 16));
  const count = Math.max(1, Math.min(50, +$('count').value || 5));

  let alphabet = '';
  if ($('upper').checked)   alphabet += SETS.upper;
  if ($('lower').checked)   alphabet += SETS.lower;
  if ($('digits').checked)  alphabet += SETS.digits;
  if ($('symbols').checked) alphabet += SETS.symbols;

  const list = $('outList');
  if (!alphabet) {
    list.innerHTML = '<div class="result err">Выберите хотя бы один набор символов.</div>';
    return;
  }

  list.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const pwd = genOne(len, alphabet);
    const row = document.createElement('div');
    row.className = 'result-wrap';
    row.style.marginBottom = '6px';
    row.innerHTML =
      '<div class="result" style="font-size:14px;min-height:auto">' + pwd + '</div>' +
      '<button class="copy">копировать</button>';
    row.querySelector('.copy').onclick = async (e) => {
      try {
        await navigator.clipboard.writeText(pwd);
        e.target.textContent = 'скопировано';
        setTimeout(() => e.target.textContent = 'копировать', 1000);
      } catch {}
    };
    list.appendChild(row);
  }
};

$('genBtn').click();
</script>
</body>
</html>
