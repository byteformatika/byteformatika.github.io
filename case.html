<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2838">
<title>ByteFormatika :: регистр текста</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <b>ByteFormatika</b>
  <span class="sep">::</span>
  <a href="index.html">главная</a>
  <span class="sep">|</span>
  <a href="tools.html">инструменты</a>
  <span class="sep">|</span>
  <span class="active">регистр</span>
  <span class="sep">|</span>
  <a href="about.html">об авторе</a>
</div>

<div class="wrap">
  <div class="head">
    <h1>Регистр <span class="byte">текста</span></h1>
    <div class="sub">// ВЕРХНИЙ, нижний, Каждое Слово //</div>
  </div>

  <div class="panel">
    <h2>Текст</h2>
    <textarea id="inp" placeholder="Введите текст…">Привет, мир! Это ByteFormatika.</textarea>
    <div class="tool-row">
      <button class="btn" data-mode="upper">ВЕРХНИЙ</button>
      <button class="btn" data-mode="lower">нижний</button>
      <button class="btn" data-mode="title">Каждое Слово</button>
      <button class="btn" data-mode="sentence">Как предложение</button>
      <button class="btn" data-mode="reverse">обратный регистр</button>
      <button class="btn" id="clearBtn">🗑</button>
    </div>
  </div>

  <div class="panel">
    <h2>Результат</h2>
    <div class="result-wrap">
      <div class="result" id="out" style="font-size:14px;white-space:pre-wrap">—</div>
      <button class="copy" id="copyBtn" hidden>копировать</button>
    </div>
  </div>

  <div class="foot">
    &copy; ByteFormatika &nbsp;·&nbsp; 2026–????<br>
    <a href="tools.html">← к инструментам</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const inpEl = $('inp'), outEl = $('out'), copyBtn = $('copyBtn');

function toTitle(s) {
  return s.toLowerCase().replace(/(^|\s|["'«(])([а-яёa-z])/gi,
    (_, p, c) => p + c.toUpperCase());
}
function toSentence(s) {
  return s.toLowerCase().replace(/(^\s*|[.!?]\s+)([а-яёa-z])/gi,
    (_, p, c) => p + c.toUpperCase());
}
function toReverse(s) {
  return s.split('').map(ch => {
    const up = ch.toUpperCase(), lo = ch.toLowerCase();
    if (ch === up && ch !== lo) return lo;
    if (ch === lo && ch !== up) return up;
    return ch;
  }).join('');
}

document.querySelectorAll('.btn[data-mode]').forEach(btn => {
  btn.onclick = () => {
    const t = inpEl.value;
    let r = t;
    switch (btn.dataset.mode) {
      case 'upper':    r = t.toUpperCase(); break;
      case 'lower':    r = t.toLowerCase(); break;
      case 'title':    r = toTitle(t); break;
      case 'sentence': r = toSentence(t); break;
      case 'reverse':  r = toReverse(t); break;
    }
    outEl.textContent = r;
    copyBtn.hidden = false;
  };
});

$('clearBtn').onclick = () => {
  inpEl.value = '';
  outEl.textContent = '—';
  copyBtn.hidden = true;
};

copyBtn.onclick = async () => {
  try {
    await navigator.clipboard.writeText(outEl.textContent);
    copyBtn.textContent = 'скопировано';
    setTimeout(() => copyBtn.textContent = 'копировать', 1200);
  } catch {}
};
</script>
</body>
</html>
